name: Release (PyPI)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # push of a canonical version (e.g. v1.2.3) without pre-release

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # 1. Check whether the tagged commit is reachable from origin/master
  check-branch:
    runs-on: ubuntu-latest
    outputs:
      is_master: ${{ steps.check.outputs.is_master }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5 # node24
        with:
          fetch-depth: 0

      - name: Check if tag is on master
        id: check
        run: |
          git fetch origin master
          if git branch -r --contains ${GITHUB_SHA} | grep -q "origin/master"; then
            echo "✅ Tag ${{ github.ref }} is on master branch. Release will be created and published to PyPI."
            echo "is_master=true" >> "$GITHUB_OUTPUT"
          else
            echo "🚀 Tag ${{ github.ref }} is not on master branch. Release will be created without PyPI publication."
            echo "is_master=false" >> "$GITHUB_OUTPUT"
          fi

  # 2. Attest and publish the optional pre-built distributions of the tagged commit (master and develop tags)
  release:
    needs: check-branch
    runs-on: ubuntu-latest
    outputs:
      has_artifacts: ${{ steps.detect_dist.outputs.has_artifacts }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5 # node24
        with:
          fetch-depth: 0

      - name: Detect pre-built distributions
        id: detect_dist
        run: |
          if find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.whl' \) | grep -q .; then
            echo "has_artifacts=true" >> "$GITHUB_OUTPUT"
            echo "Pre-built distributions found in dist/."
          else
            echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
            echo "No pre-built distributions found in dist/; continuing without release assets."
          fi

      - name: Attest build provenance
        if: steps.detect_dist.outputs.has_artifacts == 'true'
        uses: actions/attest-build-provenance@v3 # node24 composite runtime
        with:
          subject-path: dist/*

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          configurationJson: |
            {
              "categories": [
               { "title": "## ⛰️ Features", "labels": ["new"] },
               { "title": "## 🏗️ Implementations", "labels": ["implement"] },
               { "title": "## 🐛 Bug Fixes", "labels": ["fix"] },
               { "title": "## 🚜 Changes", "labels": ["change"] },
               { "title": "## 🎯 Cover Requirements", "labels": ["cover"] },
               { "title": "## ✨ Refactor", "labels": ["refactor"] },
               { "title": "## 📚 Documentation", "labels": ["docs"] },
               { "title": "## 🎨 Styling", "labels": ["style"] },
               { "title": "## ◀️ Revert", "labels": ["revert"] },
               { "title": "## ⚙️ Miscellaneous Tasks", "labels": ["misc"] },
               { "title": "## 💬 Other", "labels": ["other"] },
               { "title": "## ❓ Unknown", "labels": ["unknown"] },
               { "title": "## 🚀 Release", "labels": ["release"] }
             ],
             "ignore_labels": [
                "release",
                "ignore"
             ],
             "transformers": [
              {
                "pattern": "^[^\\(:\\s]+(\\([^\\)]+\\))?!?:\\s+([\\S]+[\\s\\S]*)",
                "target": "$2 $1"
              }
             ],
             "sort": {
                "order": "ASC",
                "on_property": "mergedAt"
             },
             "template": "#{{CHANGELOG}}\n\n<details>\n<summary>Uncategorized</summary>\n\n#{{UNCATEGORIZED}}\n</details>\n\n**Full Changelog**: [#{{FROM_TAG}}...#{{TO_TAG}}](https://github.com/#{{OWNER}}/#{{REPO}}/compare/#{{FROM_TAG}}...#{{TO_TAG}})",
              "label_extractor": [
               {
                 "pattern": "^([^\\(:\\s]+)(\\([^\\)]+\\))?!?:\\s+([\\S]+[\\s\\S]*)",
                 "on_property": "title",
                 "target": "$1"
               }
             ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v3 # node24
        with:
          draft: false
          prerelease: false
          files: dist/**/*
          fail_on_unmatched_files: false
          generate_release_notes: false
          tag_name: ${{ github.ref_name }}
          name: ${{github.event.repository.name}} ${{ github.ref_name }}
          body: ${{ steps.build_changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. Publish the pre-built distributions to PyPI via OIDC trusted publishing (master tags only)
  publish-pypi:
    needs: [check-branch, release]
    # Publish to PyPI only when the tagged commit is reachable from origin/master and
    # pre-built distributions are present; develop-only tags and artifact-free tags
    # create the GitHub Release without publishing to PyPI.
    if: needs.check-branch.outputs.is_master == 'true' && needs.release.outputs.has_artifacts == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing for PyPI project cli-usereq

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5 # node24

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true
