[build-system]
requires = ["setuptools", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-usereq"
version = "0.68.1"
description = "Initialize a project with prompts, agents, and templates from the useReq repository."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "tiktoken",
  "pyyaml",
  "pytest",
  "ruff",
  "pyright",
]
authors = [
  { name = "Ogekuri" }
]
keywords = ["astral", "uv", "project", "prompts", "templates"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/Ogekuri/CLI-useReq"
Repository = "https://github.com/Ogekuri/CLI-useReq"

[project.scripts]
use-req = "usereq.cli:main"
req = "usereq.cli:main"
usereq = "usereq.cli:main"

[tool.setuptools]
packages = ["usereq"]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
usereq = [
  "resources/prompts/*.md",
  "resources/docs/*.md",
  "resources/prompts-version.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
