[build-system]
requires = ["setuptools>=77.0.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-usereq"
version = "0.75.7"
description = "Initialize a project with prompts, agents, and templates from the useReq repository."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "tiktoken",
  "pyyaml",
  "ruff",
  "pyright",
]
authors = [
  { name = "Ogekuri" }
]
keywords = ["astral", "uv", "project", "prompts", "templates"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/Ogekuri/CLI-useReq"
Repository = "https://github.com/Ogekuri/CLI-useReq"

[project.scripts]
req = "usereq.cli:main"
usereq = "usereq.cli:main"
cli-usereq = "usereq.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
packages = [
  "usereq",
  "usereq.resources",
  "usereq.resources.guidelines",
  "usereq.resources.prompts",
  "usereq.resources.templates",
]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
usereq = [
  "resources/guidelines/*",
  "resources/prompts/*",
  "resources/templates/*",
  "resources/prompts-version.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the repository package before any PYTHONPATH or user-site shadow so
# the suite always tests the checked-out source (pre-release unit-tests stage).
pythonpath = ["src"]
